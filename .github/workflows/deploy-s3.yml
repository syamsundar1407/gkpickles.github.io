name: Deploy to S3

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy dev branch to dev bucket
        if: github.ref == 'refs/heads/dev'
        run: |
          aws s3 sync . s3://dev.gkpickles.com --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.log" \
            --exclude "README.md" \
            --exclude "analyze_sheet.py"

      - name: Deploy main branch to live bucket
        if: github.ref == 'refs/heads/main'
        run: |
          aws s3 sync . s3://gkpickles.com --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.log" \
            --exclude "README.md" \
            --exclude "analyze_sheet.py"